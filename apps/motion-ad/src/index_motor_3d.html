<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Nexora 3D Motor - Viral Reels Edition</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800;900&family=JetBrains+Mono:wght@700;800&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background: #030712;
      color: #fff;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      overflow: hidden;
      width: 1080px;
      height: 1920px;
      position: relative;
    }

    #stage {
      width: 1080px;
      height: 1920px;
      position: absolute;
      top: 0;
      left: 0;
      overflow: hidden;
      background: radial-gradient(circle at 50% 35%, #0f172a 0%, #030712 70%, #000205 100%);
    }

    #canvas3d {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1920px;
      z-index: 10;
    }

    /* Ambient Glows */
    .glow-sphere {
      position: absolute;
      border-radius: 50%;
      filter: blur(140px);
      pointer-events: none;
      z-index: 5;
    }
    .sphere-emerald {
      width: 700px;
      height: 700px;
      background: rgba(16, 185, 129, 0.22);
      top: 15%;
      left: 20%;
    }
    .sphere-cyan {
      width: 600px;
      height: 600px;
      background: rgba(6, 182, 212, 0.18);
      top: 40%;
      right: 10%;
    }

    /* Top Brand Pill */
    .top-pill {
      position: absolute;
      top: 90px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 32px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 50px;
      backdrop-filter: blur(25px);
      z-index: 50;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .top-pill .dot {
      width: 10px;
      height: 10px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 12px #10b981;
    }
    .top-pill span {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #f1f5f9;
    }

    /* 3D Floating Anticipated Labels */
    .piece-tag-container {
      position: absolute;
      top: 340px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 60;
      text-align: center;
      pointer-events: none;
    }
    .piece-tag {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      padding: 16px 36px;
      background: rgba(15, 23, 42, 0.85);
      border: 2px solid #10b981;
      border-radius: 20px;
      box-shadow: 0 0 35px rgba(16, 185, 129, 0.4), inset 0 0 15px rgba(16, 185, 129, 0.2);
      backdrop-filter: blur(20px);
      opacity: 0;
      transform: translateY(30px) scale(0.9);
      transition: none;
    }
    .piece-tag .tag-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 24px;
      font-weight: 900;
      color: #10b981;
      background: rgba(16, 185, 129, 0.15);
      padding: 4px 12px;
      border-radius: 8px;
    }
    .piece-tag .tag-text {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #fff;
    }

    /* Nex Presenter Holographic Card */
    .nex-card {
      position: absolute;
      bottom: 260px;
      left: 60px;
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 16px 26px;
      background: rgba(15, 23, 42, 0.75);
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      border-radius: 28px;
      backdrop-filter: blur(25px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      z-index: 70;
      transform-origin: bottom left;
    }
    .nex-avatar-wrapper {
      position: relative;
      width: 90px;
      height: 90px;
    }
    .nex-avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: 3px solid #10b981;
      object-fit: cover;
      box-shadow: 0 0 25px rgba(16, 185, 129, 0.5);
    }
    .nex-online-pulse {
      position: absolute;
      bottom: 4px;
      right: 4px;
      width: 18px;
      height: 18px;
      background: #10b981;
      border: 3px solid #030712;
      border-radius: 50%;
    }
    .nex-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .nex-name {
      font-size: 26px;
      font-weight: 900;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .nex-badge {
      font-size: 13px;
      font-weight: 800;
      color: #10b981;
      background: rgba(16, 185, 129, 0.15);
      padding: 3px 10px;
      border-radius: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .nex-status {
      font-size: 16px;
      font-weight: 600;
      color: #94a3b8;
    }

    /* Kinetic Subtitles (Alvaric High-Contrast) */
    .caption-container {
      position: absolute;
      bottom: 80px;
      left: 60px;
      right: 60px;
      min-height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px 30px;
      background: rgba(3, 7, 18, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      backdrop-filter: blur(30px);
      z-index: 80;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7);
    }
    .caption-text {
      font-size: 34px;
      font-weight: 800;
      line-height: 1.35;
      color: #e2e8f0;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
    }
    .caption-text .hl {
      color: #facc15;
      background: rgba(250, 204, 21, 0.12);
      padding: 2px 8px;
      border-radius: 6px;
      border-bottom: 3px solid #facc15;
    }

    /* Final CTA Overlay (47s - 51.6s) */
    .final-cta {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.9);
      width: 900px;
      padding: 60px 40px;
      background: rgba(15, 23, 42, 0.92);
      border: 3px solid #10b981;
      border-radius: 40px;
      backdrop-filter: blur(40px);
      text-align: center;
      box-shadow: 0 0 80px rgba(16, 185, 129, 0.4), inset 0 0 30px rgba(16, 185, 129, 0.2);
      z-index: 95;
      opacity: 0;
      pointer-events: none;
    }
    .final-cta h2 {
      font-size: 52px;
      font-weight: 900;
      margin-bottom: 20px;
      line-height: 1.2;
    }
    .final-cta .cta-highlight {
      display: inline-block;
      margin: 24px 0;
      padding: 18px 48px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #030712;
      font-size: 40px;
      font-weight: 900;
      border-radius: 20px;
      letter-spacing: 2px;
      box-shadow: 0 10px 35px rgba(16, 185, 129, 0.5);
    }
    .final-cta p {
      font-size: 26px;
      color: #94a3b8;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div id="stage">
    <div class="glow-sphere sphere-emerald"></div>
    <div class="glow-sphere sphere-cyan"></div>

    <div class="top-pill">
      <div class="dot"></div>
      <span>NEXORA · MOTOR 3D DO WHATSAPP</span>
    </div>

    <!-- 3D WebGL Canvas -->
    <canvas id="canvas3d"></canvas>

    <!-- Floating Anticipated Piece Tags -->
    <div class="piece-tag-container">
      <div id="pieceTag" class="piece-tag">
        <span id="pieceNum" class="tag-num">01</span>
        <span id="pieceTitle" class="tag-text">RADAR DE MENSAGENS</span>
      </div>
    </div>

    <!-- Nex Presenter Card -->
    <div id="nexCard" class="nex-card">
      <div class="nex-avatar-wrapper">
        <img src="nex-avatar.png" alt="Nex" class="nex-avatar">
        <div class="nex-online-pulse"></div>
      </div>
      <div class="nex-info">
        <div class="nex-name">
          Nex <span class="nex-badge">Atendente Oficial</span>
        </div>
        <div id="nexStatus" class="nex-status">Operando o Motor de Atendimento</div>
      </div>
    </div>

    <!-- Kinetic Subtitles -->
    <div class="caption-container">
      <div id="captionText" class="caption-text">
        Se você quer vender no WhatsApp às 3h da manhã enquanto dorme...
      </div>
    </div>

    <!-- Final CTA Overlay -->
    <div id="finalCta" class="final-cta">
      <h2>MÁQUINA DE ATENDIMENTO<br><span style="color: #10b981;">100% MONTADA</span></h2>
      <div class="cta-highlight">COMENTE "MOTOR"</div>
      <p>Para testar o Nex rodando ao vivo no seu WhatsApp</p>
    </div>
  </div>

  <script src="three.min.js"></script>
  <script>
    // Configuração Three.js
    const canvas = document.getElementById('canvas3d');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setSize(1080, 1920);
    renderer.setPixelRatio(1);
    renderer.shadowMap.enabled = true;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, 1080 / 1920, 0.1, 1000);
    camera.position.set(0, 5, 22);

    // Iluminação
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);

    const dirLight1 = new THREE.DirectionalLight(0x10b981, 2.5); // Esmeralda
    dirLight1.position.set(10, 20, 15);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0x06b6d4, 2.0); // Ciano
    dirLight2.position.set(-15, -10, 10);
    scene.add(dirLight2);

    // Grupo Central do Motor 3D
    const engineGroup = new THREE.Group();
    engineGroup.position.set(0, 1.5, 0);
    scene.add(engineGroup);

    // Pedestal Metálico com Runas Circulares
    const baseGeo = new THREE.CylinderGeometry(5.5, 6, 0.6, 64);
    const baseMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.2, metalness: 0.85 });
    const baseMesh = new THREE.Mesh(baseGeo, baseMat);
    baseMesh.position.y = -4;
    engineGroup.add(baseMesh);

    const baseRingGeo = new THREE.TorusGeometry(5.2, 0.08, 16, 64);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0x10b981 });
    const baseRing = new THREE.Mesh(baseRingGeo, ringMat);
    baseRing.rotation.x = Math.PI / 2;
    baseRing.position.y = -3.65;
    engineGroup.add(baseRing);

    // ----------------------------------------------------
    // PEÇA 1: RADAR DE MENSAGENS (Esfera de Vidro + Órbitas)
    // ----------------------------------------------------
    const radarGroup = new THREE.Group();
    const radarGeo = new THREE.SphereGeometry(1.8, 32, 32);
    const radarMat = new THREE.MeshPhysicalMaterial({
      color: 0x10b981,
      emissive: 0x065f46,
      roughness: 0.1,
      metalness: 0.9,
      transmission: 0.7,
      transparent: true,
      opacity: 0.9
    });
    const radarSphere = new THREE.Mesh(radarGeo, radarMat);
    radarGroup.add(radarSphere);

    // Órbitas
    const orbit1 = new THREE.Mesh(new THREE.TorusGeometry(2.6, 0.06, 16, 64), new THREE.MeshStandardMaterial({ color: 0x34d399, metalness: 0.8 }));
    const orbit2 = new THREE.Mesh(new THREE.TorusGeometry(3.2, 0.05, 16, 64), new THREE.MeshStandardMaterial({ color: 0x06b6d4, metalness: 0.8 }));
    orbit2.rotation.x = Math.PI / 3;
    radarGroup.add(orbit1);
    radarGroup.add(orbit2);
    radarGroup.position.y = 0;
    engineGroup.add(radarGroup);

    // ----------------------------------------------------
    // PEÇA 2: DECODIFICADOR NEURAL (Engrenagens Metálicas)
    // ----------------------------------------------------
    const decoderGroup = new THREE.Group();
    function createGear(radius, teeth) {
      const g = new THREE.Group();
      const body = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, 0.3, 32), new THREE.MeshStandardMaterial({ color: 0x475569, metalness: 0.9, roughness: 0.2 }));
      body.rotation.x = Math.PI / 2;
      g.add(body);
      for (let i = 0; i < teeth; i++) {
        const tooth = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.4, 0.3), new THREE.MeshStandardMaterial({ color: 0x10b981, metalness: 0.8 }));
        const angle = (i / teeth) * Math.PI * 2;
        tooth.position.set(Math.cos(angle) * radius, Math.sin(angle) * radius, 0);
        tooth.rotation.z = angle;
        g.add(tooth);
      }
      return g;
    }
    const gear1 = createGear(1.4, 12);
    gear1.position.set(-2.5, 1.2, 0);
    const gear2 = createGear(1.0, 8);
    gear2.position.set(-2.5, -1.0, 0.2);
    decoderGroup.add(gear1);
    decoderGroup.add(gear2);
    decoderGroup.position.x = -10; // entra voando
    engineGroup.add(decoderGroup);

    // ----------------------------------------------------
    // PEÇA 3: CILINDRO DE CONHECIMENTO (Memória Holográfica)
    // ----------------------------------------------------
    const cylinderGroup = new THREE.Group();
    const cylGeo = new THREE.CylinderGeometry(1.6, 1.6, 4.2, 32, 1, true);
    const cylMat = new THREE.MeshPhysicalMaterial({
      color: 0x06b6d4,
      emissive: 0x083344,
      roughness: 0.05,
      metalness: 0.2,
      transmission: 0.8,
      transparent: true,
      opacity: 0.75
    });
    const cylinderMesh = new THREE.Mesh(cylGeo, cylMat);
    cylinderGroup.add(cylinderMesh);

    // Núcleo de Dados Interno
    const coreGeo = new THREE.CylinderGeometry(0.5, 0.5, 3.8, 16);
    const coreMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
    const coreMesh = new THREE.Mesh(coreGeo, coreMat);
    cylinderGroup.add(coreMesh);

    cylinderGroup.position.set(0, 15, 0); // desce do topo
    engineGroup.add(cylinderGroup);

    // ----------------------------------------------------
    // PEÇA 4: BLINDAGEM ANTI-ALUCINAÇÃO (Anel Dourado Blindado)
    // ----------------------------------------------------
    const armorGroup = new THREE.Group();
    const armorRingGeo = new THREE.TorusGeometry(2.2, 0.25, 16, 6);
    const armorMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b, metalness: 0.9, roughness: 0.15, emissive: 0x78350f });
    const armorRing = new THREE.Mesh(armorRingGeo, armorMat);
    armorRing.rotation.x = Math.PI / 2;
    armorGroup.add(armorRing);

    // 4 travas magnéticas
    for (let i = 0; i < 4; i++) {
      const lock = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.8, 0.4), new THREE.MeshStandardMaterial({ color: 0x0284c7, metalness: 0.8 }));
      const a = (i / 4) * Math.PI * 2;
      lock.position.set(Math.cos(a) * 2.3, 0, Math.sin(a) * 2.3);
      lock.rotation.y = -a;
      armorGroup.add(lock);
    }
    armorGroup.position.set(0, 0, 0);
    armorGroup.scale.set(3, 3, 3); // fecha comprimindo
    armorGroup.visible = false;
    engineGroup.add(armorGroup);

    // ----------------------------------------------------
    // PEÇA 5: INJETOR DE PIX E AGENDAMENTO (Pistão + Pix Holográfico)
    // ----------------------------------------------------
    const injectorGroup = new THREE.Group();
    const pistonGeo = new THREE.CylinderGeometry(0.8, 0.8, 2.5, 24);
    const pistonMat = new THREE.MeshStandardMaterial({ color: 0x10b981, metalness: 0.95, roughness: 0.1 });
    const pistonMesh = new THREE.Mesh(pistonGeo, pistonMat);
    pistonMesh.position.y = -2;
    injectorGroup.add(pistonMesh);

    // 3D Pix Diamond Emblem
    const pixGroup = new THREE.Group();
    for (let i = 0; i < 4; i++) {
      const d = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.35, 0.15), new THREE.MeshBasicMaterial({ color: 0x34d399 }));
      const a = (i / 4) * Math.PI * 2;
      d.position.set(Math.cos(a) * 0.45, Math.sin(a) * 0.45, 0);
      d.rotation.z = Math.PI / 4;
      pixGroup.add(d);
    }
    pixGroup.position.set(0, -0.6, 1.8);
    injectorGroup.add(pixGroup);

    injectorGroup.position.set(3.2, -6, 0); // sobe da base
    injectorGroup.visible = false;
    engineGroup.add(injectorGroup);

    // Easing helpers
    function clamp(val, min, max) { return Math.max(min, Math.min(max, val)); }
    function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }
    function easeInOutQuad(x) { return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }

    // Elementos DOM
    const pieceTag = document.getElementById('pieceTag');
    const pieceNum = document.getElementById('pieceNum');
    const pieceTitle = document.getElementById('pieceTitle');
    const captionText = document.getElementById('captionText');
    const nexCard = document.getElementById('nexCard');
    const nexStatus = document.getElementById('nexStatus');
    const finalCta = document.getElementById('finalCta');

    function showTag(num, title, show) {
      if (show) {
        pieceNum.innerText = num;
        pieceTitle.innerText = title;
        pieceTag.style.opacity = '1';
        pieceTag.style.transform = 'translateY(0px) scale(1)';
      } else {
        pieceTag.style.opacity = '0';
        pieceTag.style.transform = 'translateY(20px) scale(0.9)';
      }
    }

    // Timeline control via renderFrame(t)
    window.renderFrame = function(t) {
      // Rotações contínuas base
      radarSphere.rotation.y = t * 1.2;
      orbit1.rotation.z = t * 1.8;
      orbit1.rotation.y = t * 0.9;
      orbit2.rotation.y = -t * 1.5;
      baseMesh.rotation.y = t * 0.2;

      // ----------------------------------------------------
      // GANCHOS E CENAS ALVARIC SEGUNDO A SEGUNDO
      // ----------------------------------------------------

      // [0.0s - 6.5s] Gancho Triplo: O Desejo e o Motor
      if (t >= 0 && t < 6.5) {
        camera.position.set(0, 3 + Math.sin(t) * 0.5, 20 - t * 0.3);
        camera.lookAt(0, 1, 0);
        showTag('01', 'RADAR DE MENSAGENS', false);
        captionText.innerHTML = "Se você quer vender no WhatsApp às <span class='hl'>3h da manhã</span> enquanto dorme, você precisa de um motor de atendimento.";
        nexStatus.innerText = "Apresentando o Motor de Vendas";
      }

      // [6.2s - 10.0s] Peça 1: Radar de Mensagens (Tag antecipada em 6.2s)
      else if (t >= 6.2 && t < 10.0) {
        let p = clamp((t - 6.5) / 0.5, 0, 1);
        // Punch-in zoom de 0.5s na esfera
        camera.position.set(0, 1.5, 20 - easeOutCubic(p) * 7); // zoom in para z=13
        camera.lookAt(0, 1.5, 0);
        showTag('01', 'RADAR DE MENSAGENS', true);
        captionText.innerHTML = "E a primeira peça é essa: o <span class='hl'>Radar de Mensagens</span>.";
        nexStatus.innerText = "Captando leads no segundo zero";
      }

      // [10.0s - 16.3s] O Problema do Áudio Confuso
      else if (t >= 10.0 && t < 16.0) {
        camera.position.set(0, 2, 16);
        camera.lookAt(0, 1.5, 0);
        showTag('01', 'RADAR DE MENSAGENS', false);
        captionText.innerHTML = "Só que aí vem o problema: o cliente não digita, manda um <span class='hl'>áudio de dois minutos</span> com cachorro latindo.";
        nexStatus.innerText = "Decodificando áudio ruidoso";
      }

      // [15.9s - 20.0s] Peça 2: Decodificador Neural (Tag antecipada em 15.9s)
      else if (t >= 15.9 && t < 20.0) {
        let enterP = clamp((t - 15.9) / 0.6, 0, 1);
        decoderGroup.position.x = -10 + easeOutCubic(enterP) * 7.5; // voa para -2.5
        gear1.rotation.z = t * 4;
        gear2.rotation.z = -t * 5.6;

        // Punch zoom na engrenagem
        camera.position.set(-2, 2, 16 - easeOutCubic(enterP) * 5);
        camera.lookAt(-2, 1.5, 0);
        showTag('02', 'DECODIFICADOR NEURAL', true);
        captionText.innerHTML = "Pra resolver isso, encaixamos o <span class='hl'>Decodificador Neural</span>.";
        nexStatus.innerText = "Transformando voz confusa em texto";
      }

      // [20.0s - 23.8s] Problema: IA não pode adivinhar
      else if (t >= 20.0 && t < 23.8) {
        camera.position.set(0, 3, 17);
        camera.lookAt(0, 1.5, 0);
        showTag('02', 'DECODIFICADOR NEURAL', false);
        captionText.innerHTML = "Mas a IA não pode <span class='hl'>adivinhar</span> o que você vende.";
        nexStatus.innerText = "Consultando catálogo e regras";
      }

      // [23.6s - 27.1s] Peça 3: Cilindro de Conhecimento (Desce do topo em 23.8s)
      else if (t >= 23.6 && t < 27.1) {
        let dropP = clamp((t - 23.8) / 0.7, 0, 1);
        cylinderGroup.position.y = 15 - easeOutCubic(dropP) * 13.5; // desce para y=1.5
        coreMesh.rotation.y = t * 3;

        // Punch zoom no cilindro
        camera.position.set(0, 2.5, 17 - easeOutCubic(dropP) * 5);
        camera.lookAt(0, 2, 0);
        showTag('03', 'MEMÓRIA DE FATOS', true);
        captionText.innerHTML = "Então a gente desce o <span class='hl'>Cilindro de Conhecimento</span>.";
        nexStatus.innerText = "Carregando preços, horários e serviços";
      }

      // [27.1s - 31.4s] Alívio Cognitivo Alvaric
      else if (t >= 27.1 && t < 34.0) {
        cylinderGroup.position.y = 1.5;
        camera.position.set(0, 3, 16);
        camera.lookAt(0, 1.5, 0);
        showTag('03', 'MEMÓRIA DE FATOS', false);
        captionText.innerHTML = "Calma: entender a lógica é mais importante do que <span class='hl'>decorar nomes</span>.";
        nexStatus.innerText = "Simplificando a arquitetura";
      }

      // [34.0s - 37.6s] Peça 4: Blindagem Anti-Alucinação (Tag em 34.0s)
      else if (t >= 34.0 && t < 37.6) {
        armorGroup.visible = true;
        let lockP = clamp((t - 34.2) / 0.5, 0, 1);
        let s = 3 - easeOutCubic(lockP) * 2; // escala de 3 para 1
        armorGroup.scale.set(s, s, s);
        armorGroup.position.y = 1.5;
        armorGroup.rotation.y = t * 1.5;

        // Punch zoom no anel blindado
        camera.position.set(0, 2, 16 - easeOutCubic(lockP) * 4);
        showTag('04', 'BLINDAGEM DE BOM SENSO', true);
        captionText.innerHTML = "Falta o mais perigoso: inventar mentiras. Por isso colocamos a <span class='hl'>Blindagem Anti-Alucinação</span>.";
        nexStatus.innerText = "Bloqueando respostas falsas";
      }

      // [37.6s - 43.4s] Peça 5: Injetor de Pix & Agendamento
      else if (t >= 37.6 && t < 43.4) {
        injectorGroup.visible = true;
        let upP = clamp((t - 37.8) / 0.6, 0, 1);
        injectorGroup.position.y = -6 + easeOutCubic(upP) * 6; // sobe para 0
        pixGroup.rotation.z = t * 2;

        // Punch zoom na base do Pix
        camera.position.set(2, 0, 16 - easeOutCubic(upP) * 4);
        camera.lookAt(2, 0, 0);
        showTag('05', 'INJETOR DE PIX & AGENDA', true);
        captionText.innerHTML = "E na saída, a peça que bota dinheiro no seu bolso: o <span class='hl'>Injetor de Pix e Agendamento</span>.";
        nexStatus.innerText = "Confirmando pagamento e reserva";
      }

      // [43.4s - 47.0s] Partida Geral do Motor (Clímax)
      else if (t >= 43.4 && t < 47.0) {
        showTag('00', 'MÁQUINA ATIVA · 100%', true);
        // Todas as peças girando e operando juntas
        gear1.rotation.z = t * 8;
        gear2.rotation.z = -t * 11;
        armorGroup.rotation.y = t * 3;
        coreMesh.rotation.y = t * 6;

        // Recuo dramático da câmera (wide angle épico)
        camera.position.set(0, 4, 12 + (t - 43.4) * 2.5); // afasta até 21
        camera.lookAt(0, 1, 0);
        captionText.innerHTML = "Pronto: você acabou de montar sua <span class='hl'>máquina de vendas</span>.";
        nexStatus.innerText = "Motor rodando a 100% de capacidade";
      }

      // [47.0s - 51.6s] Final CTA de 1 Palavra (Alvaric)
      else if (t >= 47.0) {
        showTag('00', 'COMENTE "MOTOR"', false);
        finalCta.style.opacity = '1';
        let ctaP = clamp((t - 47.2) / 0.4, 0, 1);
        finalCta.style.transform = `translate(-50%, -50%) scale(${0.85 + easeOutCubic(ctaP) * 0.15})`;

        camera.position.set(0, 4, 22);
        camera.lookAt(0, 1, 0);
        captionText.innerHTML = "Comente <span class='hl'>MOTOR</span> aqui embaixo que eu te mostro ela funcionando na sua empresa.";
        nexStatus.innerText = "Aguardando seu comentário: MOTOR";
      }

      // Renderiza cena Three.js
      renderer.render(scene, camera);
    };

    // Autoplay local para visualização
    let startTimestamp = null;
    function previewLoop(timestamp) {
      if (!startTimestamp) startTimestamp = timestamp;
      let elapsed = (timestamp - startTimestamp) / 1000;
      if (elapsed > 51.6) startTimestamp = timestamp;
      window.renderFrame(elapsed % 51.6);
      requestAnimationFrame(previewLoop);
    }
    if (!window.__PUPPETEER_CONTROLLER__) {
      requestAnimationFrame(previewLoop);
    }
  </script>
</body>
